name: Android
# Compila la app de Android en los servidores de GitHub (sin Android Studio):
# web → proyecto Android de Capacitor → íconos → .aab firmado para Google Play (+ .apk para probar).
# Se ejecuta desde la pestaña Actions ("Run workflow") o al subir una etiqueta como v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Con estos secretos la app usa los anuncios reales; sin ellos, los de prueba de Google.
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      # Cada subida a Google Play necesita un versionCode mayor.
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Dependencias
        run: npm install --no-audit --no-fund
      - name: Tipos y pruebas
        run: npm run typecheck && npm test
      - name: Build web
        run: npm run build

      - name: Android SDK 36
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Proyecto Android (Capacitor)
        run: |
          npx cap add android
          node scripts/android-configure.mjs
          npx --yes @capacitor/assets@3 generate --android --assetPath assets
          npx cap sync android

      - name: Llave de subida (upload key)
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Compilar (firmado para Google Play)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Compilar (sin firma de tienda, solo para probar)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Guardar archivos
        uses: actions/upload-artifact@v4
        with:
          name: onda-radio-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Borrador privado de "Release" con los archivos sueltos (solo lo ve el dueño del repo),
      # para descargar el .aab o el .apk directo sin descomprimir nada.
      - name: Borrador de release
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/onda-radio-$VERSION-$VERSION_CODE.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "out/onda-radio-$VERSION-$VERSION_CODE.apk"
          gh release create "v$VERSION-build$VERSION_CODE" out/* --draft --target "$GITHUB_SHA" \
            --title "Onda Radio $VERSION (versionCode $VERSION_CODE)" \
            --notes "Archivos para Google Play (.aab) y para instalar directo en Android (.apk)."

      # Copia temporal del .aab en la rama "play-upload" para subirlo a Play Console desde el navegador.
      # Después de subirlo, la rama se puede borrar.
      - name: Copia para Play Console
        if: env.HAS_KEYSTORE == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TMP=$(mktemp -d)
          cp out/*.aab "$TMP/onda-radio.aab"
          cd "$TMP"
          git init -q -b play-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onda-radio.aab
          git commit -q -m "Onda Radio $VERSION ($VERSION_CODE) para Play Console"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" play-upload
